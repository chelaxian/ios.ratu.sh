name: Build CatMCP CC rootless

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/CatMCPCC-rootless/**'
      - '.github/workflows/build-catmcpcc-rootless.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          brew install ldid dpkg || { brew install ldid-procursus; brew install dpkg; }
          git clone --quiet --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
      - name: Build and require PTRAUTH arm64e
        run: |
          cd source/CatMCPCC-rootless
          THEOS="$HOME/theos" make clean package FINALPACKAGE=1
          cp postinst .theos/_/DEBIAN/ && chmod 755 .theos/_/DEBIAN/postinst
          dpkg-deb -Zgzip --root-owner-group -b .theos/_ packages/rootless.deb
          tmp="$(mktemp -d)"; dpkg-deb -x packages/rootless.deb "$tmp"
          for binary in "$tmp/var/jb/Library/ControlCenter/Bundles/CatMCPCC.bundle/CatMCPCC" "$tmp/var/jb/usr/bin/catmcpcchelper"; do
            lipo -thin arm64e "$binary" -output "$tmp/check.arm64e"
            test "$(xxd -p -s 8 -l 4 "$tmp/check.arm64e")" = "02000080"
          done
          mkdir artifacts && cp packages/rootless.deb artifacts/com.ratush.catmcpcc_1.0.0+ratu10+rootless1_iphoneos-arm64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: catmcpcc-rootless-deb
          path: source/CatMCPCC-rootless/artifacts/*.deb
          if-no-files-found: error
