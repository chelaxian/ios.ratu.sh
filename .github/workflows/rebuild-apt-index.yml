name: Rebuild APT index

# Publishing a .deb is a two-step operation: this workflow derives Packages,
# Packages.gz, Packages.bz2 and Release from the files committed in debs/.
# Keeping generated index data out of hand edits prevents stale checksums and
# missing download entries in Sileo/Zebra.
on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
      - 'scripts/build-index.sh'
      - '.github/workflows/rebuild-apt-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install APT index tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev bzip2

      - name: Build repository metadata
        # The repository is edited from Windows too, where Git may not retain
        # an executable bit. Invoke Bash explicitly rather than relying on it.
        run: bash ./scripts/build-index.sh

      - name: Commit updated metadata
        run: |
          if git diff --quiet -- Packages Packages.gz Packages.bz2 Release; then
            echo 'APT metadata is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Packages Packages.gz Packages.bz2 Release
          git commit -m 'Rebuild APT package index'
          git push
