name: Build CCGapCloser rootless

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/CCGapCloser-rootless/**'
      - '.github/workflows/build-ccgapcloser-rootless.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos and SDK
        run: |
          brew install ldid dpkg || { brew install ldid-procursus; brew install dpkg; }
          git clone --quiet --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout --quiet
          mkdir -p "$HOME/theos/sdks"
          cp -a /tmp/sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/"
      - name: Build and require PTRAUTH arm64e
        run: |
          cd source/CCGapCloser-rootless
          THEOS="$HOME/theos" THEOS_PLATFORM_SDK_ROOT="$HOME/theos/sdks/iPhoneOS16.5.sdk" make clean package FINALPACKAGE=1
          deb="$(echo packages/*.deb)"
          tmp="$(mktemp -d)"
          dpkg-deb -x "$deb" "$tmp"
          dylib="$tmp/var/jb/Library/MobileSubstrate/DynamicLibraries/CCGapCloser.dylib"
          lipo -thin arm64e "$dylib" -output "$tmp/CCGapCloser.arm64e"
          test "$(xxd -p -s 8 -l 4 "$tmp/CCGapCloser.arm64e")" = "02000080"
          mkdir artifacts
          cp "$deb" artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: ccgapcloser-rootless-deb
          path: source/CCGapCloser-rootless/artifacts/*.deb
          if-no-files-found: error
