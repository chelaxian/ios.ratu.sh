name: Build EtcHosts17 mDNS hook
on:
  push:
    branches: ['codex/**']
    paths: ['source/EtcHosts17-mdns/**', 'source/DNSProfileConfigurator/**', '.github/workflows/build-etchosts17-mdns.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: |
          brew install ldid dpkg || { brew install ldid-procursus; brew install dpkg; }
          git clone --quiet --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks && git sparse-checkout set --no-cone iPhoneOS16.5.sdk && git checkout --quiet
          mkdir -p "$HOME/theos/sdks" && cp -a /tmp/sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/"
      - name: Build packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          for p in EtcHosts17-mdns DNSProfileConfigurator; do
            [ -d "source/$p" ] || continue
            ( cd "source/$p"
              THEOS="$HOME/theos" THEOS_PLATFORM_SDK_ROOT="$HOME/theos/sdks/iPhoneOS16.5.sdk" make clean package FINALPACKAGE=1
              if [ -x ./post-package.sh ]; then ./post-package.sh; fi
              cp packages/*.deb "$GITHUB_WORKSPACE/artifacts/" )
          done
      - name: Verify arm64e PAC ABI
        run: |
          for d in artifacts/*.deb; do
            t="$(mktemp -d)"; dpkg-deb -x "$d" "$t"
            find "$t" -type f | while read -r b; do
              if file "$b" | grep -q 'Mach-O'; then
                if lipo -info "$b" | grep -q arm64e; then
                  lipo -thin arm64e "$b" -output "$t/a"
                  test "$(xxd -p -s 8 -l 4 "$t/a")" = 02000080 || { echo "bad arm64e ABI: $b"; exit 1; }
                  echo "ok arm64e PAC: $b"
                fi
              fi
            done
            dpkg-deb -I "$d"
          done
      - uses: actions/upload-artifact@v4
        with: {name: etchosts17-v1-debs, path: artifacts/*.deb}
