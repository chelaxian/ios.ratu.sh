name: Build EtcHosts17 rootless
on:
  push:
    paths: ['source/EtcHosts17-rootless/**', '.github/workflows/build-etchosts17-rootless.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: |
          brew install ldid dpkg || { brew install ldid-procursus; brew install dpkg; }
          git clone --quiet --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks && git sparse-checkout set --no-cone iPhoneOS16.5.sdk && git checkout --quiet
          mkdir -p "$HOME/theos/sdks" && cp -a /tmp/sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/"
      - run: |
          cd source/EtcHosts17-rootless
          THEOS="$HOME/theos" THEOS_PLATFORM_SDK_ROOT="$HOME/theos/sdks/iPhoneOS16.5.sdk" make clean package FINALPACKAGE=1
          cp postinst.rootless .theos/_/DEBIAN/postinst; cp prerm.rootless .theos/_/DEBIAN/prerm; chmod 755 .theos/_/DEBIAN/postinst .theos/_/DEBIAN/prerm
          dpkg-deb -Zgzip --root-owner-group -b .theos/_ packages/rootless.deb
          tmp="$(mktemp -d)"; dpkg-deb -x packages/rootless.deb "$tmp"
          for b in "$tmp/var/jb/Library/PreferenceBundles/EtcHosts17Prefs.bundle/EtcHosts17Prefs" "$tmp/var/jb/usr/libexec/etchosts17dns" "$tmp/var/jb/usr/libexec/etchosts17resolv"; do lipo -thin arm64e "$b" -output "$tmp/a"; test "$(xxd -p -s 8 -l 4 "$tmp/a")" = 02000080; done
          mkdir artifacts && cp packages/rootless.deb artifacts/com.ratush.etchosts17_0.8.1+rootless1_iphoneos-arm64.deb
      - uses: actions/upload-artifact@v4
        with: {name: etchosts17-rootless-deb, path: source/EtcHosts17-rootless/artifacts/*.deb}
