name: Build Daemon Presets rootless
on:
  push:
    paths: ['source/RatuDaemonPresets/**', '.github/workflows/build-daemon-presets.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Theos
        run: |
          brew install ldid dpkg
          git clone --quiet --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout --quiet
          mkdir -p "$HOME/theos/sdks"
          cp -a /tmp/sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/"
      - name: Build and validate ABI
        run: |
          cd source/RatuDaemonPresets
          chmod 755 layout/DEBIAN layout/DEBIAN/*
          THEOS="$HOME/theos" make clean package FINALPACKAGE=1
          deb="$(echo packages/*.deb)"
          tmp="$(mktemp -d)"
          dpkg-deb -x "$deb" "$tmp"
          test "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64
          for b in "$tmp/var/jb/Library/PreferenceBundles/RatuDaemonPrefs.bundle/RatuDaemonPrefs" "$tmp/var/jb/Library/ControlCenter/Bundles/RatuDaemonCC.bundle/RatuDaemonCC"; do
            lipo -thin arm64e "$b" -output "$tmp/slice"
            test "$(xxd -p -s 8 -l 4 "$tmp/slice")" = 02000080
          done
          test -f "$tmp/var/jb/usr/share/ratu-daemon-presets/catalog.plist"
          shasum -a 256 "$deb"
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-presets-rootless
          path: source/RatuDaemonPresets/packages/*.deb
          retention-days: 7
