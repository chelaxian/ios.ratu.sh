name: Verify public Shadow release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Verify packages and public APT indexes
        run: python3 -u scripts/verify-shadow-public.py
