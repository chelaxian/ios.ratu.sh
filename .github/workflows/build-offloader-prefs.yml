name: Build Offloader Preferences

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          brew install ldid make
          mkdir -p "$HOME/theos/sdks"
          ln -s "$(xcrun --sdk iphoneos --show-sdk-path)" "$HOME/theos/sdks/iPhoneOS17.0.sdk"

      - name: Build preference bundle
        working-directory: source/OffloaderPrefsFix
        env:
          THEOS: ${{ github.workspace }}/../theos
        run: |
          export THEOS="$HOME/theos"
          gmake clean package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: offloader-prefs-build
          path: source/OffloaderPrefsFix/packages/*.deb
