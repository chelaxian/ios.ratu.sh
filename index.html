<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ios.ratu.sh</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101114;
      color: #f4f4f5;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    main {
      width: min(720px, 100%);
    }
    img {
      width: 72px;
      height: 72px;
      border-radius: 16px;
    }
    h1 {
      margin: 24px 0 8px;
      font-size: clamp(32px, 7vw, 56px);
      line-height: 1;
    }
    p {
      color: #c8cad0;
      font-size: 18px;
      line-height: 1.55;
      max-width: 58ch;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }
    a {
      color: inherit;
    }
    .button {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid #3f424a;
      border-radius: 8px;
      background: #1b1d22;
      text-decoration: none;
      font-weight: 600;
    }
    code {
      color: #ffffff;
      background: #1b1d22;
      padding: 2px 6px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <main>
    <img src="/CydiaIcon.png" alt="ios.ratu.sh icon">
    <h1>ios.ratu.sh</h1>
    <p>Personal APT repository for iOS 17.0 arm64e packages adapted for RootHide Bootstrap 2.2.</p>
    <p>Add <code>https://ios.ratu.sh/</code> in Sileo or another compatible package manager.</p>
    <div class="actions">
      <a class="button" href="sileo://source/https://ios.ratu.sh/">Add to Sileo</a>
      <a class="button" href="/Packages">Packages</a>
      <a class="button" href="/Release">Release</a>
    </div>
  </main>
</body>
</html>
