<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121417">
  <title>ios.ratu.sh</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #121417;
      color: #f4f5f7;
      letter-spacing: 0;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #121417; }
    button, input { font: inherit; letter-spacing: 0; }
    a { color: inherit; }
    header { border-bottom: 1px solid #2c3036; background: #171a1f; }
    .header-inner, main, footer { width: min(920px, calc(100% - 32px)); margin: 0 auto; }
    .header-inner { display: flex; align-items: center; gap: 16px; min-height: 112px; padding: 18px 0; }
    .repo-icon { width: 64px; height: 64px; border-radius: 8px; flex: 0 0 auto; }
    .brand { min-width: 0; flex: 1; }
    h1 { margin: 0 0 6px; font-size: 28px; line-height: 1.1; }
    .subtitle { margin: 0; color: #aeb4bd; font-size: 15px; line-height: 1.45; }
    .add-button {
      display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
      padding: 0 16px; border-radius: 7px; background: #2ea9b7; color: #071315;
      text-decoration: none; font-weight: 750; white-space: nowrap;
    }
    .lang-switch { display: inline-flex; gap: 2px; padding: 3px; border-radius: 7px; background: #23272d; flex: 0 0 auto; }
    .lang-switch button { min-height: 32px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: #aeb4bd; cursor: pointer; font-weight: 650; }
    .lang-switch button[aria-pressed="true"] { background: #424852; color: #fff; }
    main { padding: 24px 0 44px; }
    .toolbar { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
    .search-wrap { position: relative; }
    .search-wrap span { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: #858c96; }
    #search {
      width: 100%; height: 44px; border: 1px solid #343941; border-radius: 7px;
      padding: 0 14px 0 39px; background: #1b1f24; color: #f4f5f7; outline: none;
    }
    #search:focus { border-color: #2ea9b7; box-shadow: 0 0 0 3px rgba(46,169,183,.16); }
    .segments { display: inline-flex; gap: 2px; padding: 3px; border-radius: 7px; background: #23272d; }
    .segments button {
      min-height: 36px; padding: 0 12px; border: 0; border-radius: 5px;
      background: transparent; color: #aeb4bd; cursor: pointer;
    }
    .segments button[aria-selected="true"] { background: #424852; color: #fff; }
    .summary { display: flex; justify-content: space-between; gap: 16px; margin: 22px 0 10px; color: #949ba5; font-size: 14px; }
    .package-group { margin-top: 24px; }
    .group-heading {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      margin: 0; padding: 0 2px 9px; border-bottom: 1px solid #343941; font-size: 17px;
    }
    .group-count { color: #858c96; font-size: 13px; font-weight: 500; }
    .package-list { list-style: none; margin: 0; padding: 0; }
    .package-row {
      display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px;
      align-items: start; padding: 14px 2px; border-bottom: 1px solid #292d33;
    }
    .package-symbol {
      display: grid; place-items: center; width: 42px; height: 42px; border-radius: 7px;
      background: #f2ba2f; color: #17130a; font-size: 21px; font-weight: 800;
    }
    .package-symbol.tool { background: #46a6d8; color: #07141c; }
    .package-symbol.library { background: #d27c67; color: #1a0b08; }
    .package-symbol.archive { background: #9298a3; color: #121417; }
    .package-name { margin: 0; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
    .package-id { margin-top: 3px; color: #858c96; font-size: 12px; overflow-wrap: anywhere; }
    .package-description {
      display: -webkit-box; margin: 7px 0 0; overflow: hidden; color: #b7bdc6;
      font-size: 13px; line-height: 1.45; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
    }
    .package-meta { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; max-width: 220px; }
    .tag { padding: 4px 7px; border: 1px solid #3a4048; border-radius: 5px; color: #c8cdd4; font-size: 11px; white-space: nowrap; }
    .tag.roothide { border-color: #3b8173; color: #7fd0bd; }
    .tag.rootless { border-color: #326f91; color: #79bfe6; }
    .tag.sideload { border-color: #6d4ba8; color: #c4a6ef; }
    .tag.trollfools { border-color: #2f7d4f; color: #7fd2a8; }
    .tag.dylib { border-color: #7a4fb8; color: #c4a6ef; }
    .package-name a { text-decoration: none; }
    .package-name a:hover { color: #2ea9b7; }
    .package-meta a.tag { text-decoration: none; cursor: pointer; }
    .package-meta a.tag:hover { color: #fff; border-color: #5b6471; }
    .package-symbol.dylib { background: #9b6ddb; color: #160a2e; }
    .muted { color: #858c96; }
    .empty, .loading { padding: 48px 0; text-align: center; color: #949ba5; }
    .error { color: #ef8d80; }
    footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; padding: 20px 0 32px; border-top: 1px solid #2c3036; color: #858c96; font-size: 13px; }
    footer nav { display: flex; gap: 14px; }
    @media (max-width: 720px) {
      .header-inner { align-items: flex-start; flex-wrap: wrap; }
      .add-button { width: 100%; }
      .lang-switch { order: 2; }
      .toolbar { grid-template-columns: 1fr; }
      .segments { display: grid; grid-template-columns: repeat(3, 1fr); }
      .segments button { padding: 0 4px; font-size: 11px; }
      .package-row { grid-template-columns: 38px minmax(0, 1fr); }
      .package-symbol { width: 38px; height: 38px; }
      .package-meta { grid-column: 2; justify-content: flex-start; max-width: none; }
    }
  </style>
<script>window.addEventListener("error",function(e){var c=document.getElementById("catalog");if(c){c.className="empty error";c.textContent="Script error: "+e.message+" ("+(e.lineno||0)+")";}});</script></head>
<body>
  <header>
    <div class="header-inner">
      <img class="repo-icon" src="/CydiaIcon.png" alt="">
      <div class="brand">
        <h1>ios.ratu.sh</h1>
        <p class="subtitle" data-i18n="subtitle">Packages for Dopamine 3.x / RootHide Bootstrap 2.x and other modern rootless jailbreaks</p>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
      </div>
      <a class="add-button" href="sileo://source/https://ios.ratu.sh/" data-i18n="add">Add to Sileo</a>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <label class="search-wrap">
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Search packages" data-i18n-ph="search" autocomplete="off">
      </label>
      <div class="segments" role="tablist" data-i18n-aria="category">
        <button type="button" role="tab" data-filter="all" aria-selected="true" data-i18n="tab_all">All</button>
        <button type="button" role="tab" data-filter="tweaks" aria-selected="false" data-i18n="tab_tweaks">Tweaks</button>
        <button type="button" role="tab" data-filter="tools" aria-selected="false" data-i18n="tab_tools">Tools</button>
        <button type="button" role="tab" data-filter="libraries" aria-selected="false" data-i18n="tab_libraries">Libraries</button>
        <button type="button" role="tab" data-filter="dylibs" aria-selected="false">Dylibs</button>
        <button type="button" role="tab" data-filter="archive" aria-selected="false" data-i18n="tab_archive">Archive</button>
      </div>
    </div>
    <div class="summary"><span id="package-count">…</span><span>iOS 15.0 - 26.0.1</span></div>
    <div id="catalog" class="loading">Loading…</div>
  </main>

  <footer>
    <span>RootHide · rootless · arm64 · arm64e</span>
    <nav><a href="/Packages">Packages</a><a href="/Release">Release</a><a href="https://github.com/chelaxian/ios.ratu.sh">GitHub</a></nav>
  </footer>

  <script>
  (() => {
    const I18N = {
      en: {
        subtitle: 'Packages for Dopamine 3.x / RootHide Bootstrap 2.x and other modern rootless jailbreaks',
        add: 'Add to Sileo', search: 'Search packages', category: 'Package category',
        tab_all: 'All', tab_tweaks: 'Tweaks', tab_tools: 'Tools', tab_libraries: 'Libraries', tab_archive: 'Archive',
        loading_index: 'Loading index…', reading: 'Reading Packages…',
        group_tweaks: 'Tweaks', group_tools: 'Tools', group_libraries: 'System components and libraries', group_archive: 'Archive',
        group_dylibs: 'Dylibs — for injection via Sideloadly / TrollFools',
        count_of: (a, b) => a + ' of ' + b, count_dylib: n => n + ' dylib',
        none: 'Nothing found',
        no_dylibs: 'No .dylib files yet. Put a file into <code>sideload/</code> and add an entry to <code>dylibs.json</code>.',
        download_deb: label => 'Download .deb (' + label + ')', download_dylib: 'Download .dylib',
        injection: 'Injection via Sideloadly / TrollFools.',
        index_unavailable: 'Index unavailable', load_failed: msg => 'Failed to load Packages: ' + msg
      },
      ru: {
        subtitle: 'Пакеты для Dopamine 3.x / RootHide Bootstrap 2.x и других современных rootless-джейлбрейков',
        add: 'Добавить в Sileo', search: 'Поиск по пакетам', category: 'Категория пакетов',
        tab_all: 'Все', tab_tweaks: 'Твики', tab_tools: 'Инструменты', tab_libraries: 'Библиотеки', tab_archive: 'Архив',
        loading_index: 'Загрузка индекса…', reading: 'Читаю Packages…',
        group_tweaks: 'Твики', group_tools: 'Инструменты', group_libraries: 'Системные компоненты и библиотеки', group_archive: 'Архив',
        group_dylibs: 'Dylibs — для инъекции через Sideloadly / TrollFools',
        count_of: (a, b) => a + ' из ' + b, count_dylib: n => n + ' dylib',
        none: 'Ничего не найдено',
        no_dylibs: 'Пока нет ни одной .dylib. Положи файл в <code>sideload/</code> и добавь запись в <code>dylibs.json</code>.',
        download_deb: label => 'Скачать .deb (' + label + ')', download_dylib: 'Скачать .dylib',
        injection: 'Инъекция через Sideloadly / TrollFools.',
        index_unavailable: 'Индекс недоступен', load_failed: msg => 'Не удалось загрузить Packages: ' + msg
      }
    };
    let lang = 'en';
    try {
      const fromUrl = new URLSearchParams(location.search).get('lang');
      const saved = localStorage.getItem('lang');
      lang = [fromUrl, saved].find(v => v === 'en' || v === 'ru') || ((navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en');
    } catch (e) {}
    const t = (key, ...args) => { const v = I18N[lang][key]; return typeof v === 'function' ? v(...args) : v; };
    let pkgI18n = {};
    // Package text: English comes from Packages; Russian overrides come from i18n.json.
    function pkgText(item, field) {
      const ru = lang === 'ru' && pkgI18n[item.Package] && pkgI18n[item.Package].ru;
      return (ru && ru[field]) || item[field] || '';
    }
    const dylibText = item => (lang === 'ru' && item.description_ru) || item.description || '';

    const catalog = document.querySelector('#catalog');
    const countLabel = document.querySelector('#package-count');
    let loadState = 'loading';
    let loadError = '';
    const search = document.querySelector('#search');
    const tabs = [...document.querySelectorAll('[data-filter]')];
    let packages = [];
    let dylibs = [];
    let activeFilter = 'all';

    const toolSections = new Set(['Development', 'Utilities', 'Packaging', 'Administration', 'Networking', 'Security', 'Archiving', 'Scripting', 'Text_Editors', 'Terminal_Support']);
    const librarySections = new Set(['Libraries', 'System', 'Tweak Injection', 'Keyrings']);
    const libraryPackages = new Set([]);
    const archivedPackages = new Set([
      'com.netskao.appdata',
      'com.ratush.vpnappbridge',
      'com.snail.autovpn.global',
      'com.catmcp.daemon',
      'com.ratush.catmcp-fix',
      'com.ratush.cchppe',
      'xyz.cypwn.cr4shed',
      'com.ratush.jetsamfix',
      'com.ratush.safeguard',
      'com.ratush.addtofolderfix',
      'com.choco.tg'
    ]);

    function parseIndex(text) {
      const stanzas = text.trim().split(/\n\s*\n/).map(block => {
        const item = {};
        let current = '';
        block.split('\n').forEach(line => {
          const match = line.match(/^([^:]+):\s*(.*)$/);
          if (match) { current = match[1]; item[current] = match[2]; }
          else if (/^\s/.test(line) && current) item[current] += ' ' + line.trim();
        });
        return item;
      }).filter(item => item.Package);

      const grouped = new Map();
      stanzas.forEach(item => {
        const key = item.Package;
        if (!grouped.has(key)) grouped.set(key, { ...item, architectures: new Set(), versions: new Set(), variants: [] });
        const group = grouped.get(key);
        // Rootless metadata is current; legacy RootHide variants keep their own downloads.
        if (item.Architecture === 'iphoneos-arm64') {
          if (item.Name) group.Name = item.Name;
          if (item.Description) group.Description = item.Description;
        }
        group.architectures.add(item.Architecture || 'all');
        group.versions.add(item.Version || '');
        group.variants.push({ version: item.Version || '', architecture: item.Architecture || 'all', filename: item.Filename || '', size: Number(item.Size || 0) });
        if (item.Section === 'Tweaks') group.Section = 'Tweaks';
      });
      grouped.forEach(group => group.variants.sort((a, b) => a.architecture.localeCompare(b.architecture)));
      return [...grouped.values()].sort((a, b) => (a.Name || a.Package).localeCompare(b.Name || b.Package));
    }

    function kindOf(item) {
      if (archivedPackages.has(item.Package)) return 'archive';
      if (libraryPackages.has(item.Package)) return 'libraries';
      if ((item.Section || '').startsWith('Tweaks')) return 'tweaks';
      if (librarySections.has(item.Section)) return 'libraries';
      return toolSections.has(item.Section) ? 'tools' : 'tools';
    }

    function fmtSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    // Link to the first variant's .deb (default target when clicking the name).
    function debHref(item) {
      const f = item.variants && item.variants[0] && item.variants[0].filename;
      return f ? `/${f}` : null;
    }

    function archTags(item) {
      if (!item.variants || !item.variants.length) return '';
      return item.variants.map(v => {
        const arch = v.architecture;
        const cls = arch === 'iphoneos-arm64e' ? 'roothide' : arch === 'iphoneos-arm64' ? 'rootless' : '';
        const label = arch === 'iphoneos-arm64e' ? 'RootHide' : arch === 'iphoneos-arm64' ? 'Rootless' : arch;
        if (!v.filename) return `<span class="tag ${cls}">${escapeHtml(label)}</span>`;
        return `<a class="tag ${cls}" href="/${escapeAttr(v.filename)}" download title="${escapeAttr(t('download_deb', label))}">${escapeHtml(label)}</a>`;
      }).join('');
    }

    function versionTags(item) {
      return [...item.versions].sort().map(version => `<span class="tag">${escapeHtml(version)}</span>`).join('');
    }

    function dylibTags(item) {
      return (item.tags || []).map(tag => `<a class="tag ${escapeAttr(tag)}" href="${escapeAttr(item.filename || '#')}" download title="${escapeAttr(t('download_dylib'))}">${escapeHtml(tag)}</a>`).join('');
    }

    function escapeHtml(value = '') {
      return value.replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    }
    function escapeAttr(value = '') { return escapeHtml(value); }

    // Wraps the package name in a direct .deb link when a filename is available.
    function nameHtml(item) {
      const name = escapeHtml(pkgText(item, 'Name') || item.Package);
      const href = debHref(item);
      return href ? `<a href="${escapeAttr(href)}" download>${name}</a>` : name;
    }

    function renderDylibs(visible) {
      if (!visible.length) return '';
      const rows = visible.map(item => {
        const size = fmtSize(item.size);
        const name = escapeHtml(item.name || item.package);
        const href = item.filename ? `/${escapeAttr(item.filename)}` : null;
        const nameLink = href ? `<a href="${escapeAttr(href)}" download>${name}</a>` : name;
        const meta = `${escapeHtml(item.version || '')}${size ? ' · ' + escapeHtml(size) : ''}${item.sha256 ? ' · sha256 ' + escapeHtml(item.sha256.slice(0, 8)) + '…' : ''}`;
        return `<li class="package-row">
            <span class="package-symbol dylib" aria-hidden="true">⌬</span>
            <div>
              <h3 class="package-name">${nameLink}</h3>
              <div class="package-id">${escapeHtml(item.package || '')}${item.author ? ' · ' + escapeHtml(item.author) : ''}</div>
              <p class="package-description">${escapeHtml(dylibText(item))}</p>
              <div class="package-id muted">${escapeHtml(t('injection'))} ${escapeHtml(meta)}</div>
            </div>
            <div class="package-meta">${dylibTags(item)}</div>
          </li>`;
      }).join('');
      return `<section class="package-group"><h2 class="group-heading"><span>${escapeHtml(t('group_dylibs'))}</span><span class="group-count">${visible.length}</span></h2><ul class="package-list">${rows}</ul></section>`;
    }

    function applyStatic() {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
      document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
      document.querySelectorAll('[data-lang]').forEach(el => el.setAttribute('aria-pressed', String(el.dataset.lang === lang)));
    }

    function render() {
      if (loadState === 'error') {
        countLabel.textContent = t('index_unavailable');
        catalog.className = 'empty error';
        catalog.textContent = t('load_failed', loadError);
        return;
      }
      if (loadState === 'loading') {
        countLabel.textContent = t('loading_index');
        catalog.className = 'loading';
        catalog.textContent = t('reading');
        return;
      }
      const query = search.value.trim().toLocaleLowerCase(lang);

      if (activeFilter === 'dylibs') {
        const visible = dylibs.filter(item => {
          const haystack = [item.name, item.package, dylibText(item)].join(' ').toLocaleLowerCase(lang);
          return !query || haystack.includes(query);
        });
        countLabel.textContent = t('count_dylib', visible.length);
        catalog.className = '';
        catalog.innerHTML = visible.length
          ? renderDylibs(visible)
          : '<div class="empty">' + t('no_dylibs') + '</div>';
        return;
      }

      const visible = packages.filter(item => {
        const kind = kindOf(item);
        const haystack = [pkgText(item, 'Name'), item.Package, pkgText(item, 'Description'), item.Section].join(' ').toLocaleLowerCase(lang);
        return (activeFilter === 'all' || kind === activeFilter) && (!query || haystack.includes(query));
      });
      const totalDylibs = dylibs.length;
      const totalCount = packages.length + totalDylibs;
      const visibleCount = activeFilter === 'all' ? visible.length + totalDylibs : visible.length;
      countLabel.textContent = t('count_of', visibleCount, totalCount);
      if (!visible.length && !(activeFilter === 'all' && totalDylibs)) { catalog.className = 'empty'; catalog.textContent = t('none'); return; }

      const groups = ['tweaks', 'tools', 'libraries', 'archive'].map(kind => [kind, t('group_' + kind)]);
      catalog.className = '';
      const aptHtml = groups.map(([kind, title]) => {
        const items = visible.filter(item => kindOf(item) === kind);
        if (!items.length) return '';
        const rows = items.map(item => {
          const iconClass = kind === 'archive' ? 'archive' : kind === 'tweaks' ? '' : kind === 'libraries' ? 'library' : 'tool';
          const symbol = kind === 'archive' ? '▣' : kind === 'tweaks' ? '⌁' : kind === 'libraries' ? 'L' : '›_';
          return `<li class="package-row">
            <span class="package-symbol ${iconClass}" aria-hidden="true">${symbol}</span>
            <div>
              <h3 class="package-name">${nameHtml(item)}</h3>
              <div class="package-id">${escapeHtml(item.Package)}</div>
              <p class="package-description">${escapeHtml(pkgText(item, 'Description'))}</p>
            </div>
            <div class="package-meta">${versionTags(item)}${archTags(item)}</div>
          </li>`;
        }).join('');
        return `<section class="package-group"><h2 class="group-heading"><span>${title}</span><span class="group-count">${items.length}</span></h2><ul class="package-list">${rows}</ul></section>`;
      }).join('');
      const dylibHtml = (activeFilter === 'all' && totalDylibs) ? renderDylibs(dylibs) : '';
      catalog.innerHTML = aptHtml + dylibHtml;
    }

    tabs.forEach(tab => tab.addEventListener('click', () => {
      activeFilter = tab.dataset.filter;
      tabs.forEach(item => item.setAttribute('aria-selected', String(item === tab)));
      render();
    }));
    search.addEventListener('input', render);

    // Load dylibs first (they do not depend on the APT index).
    fetch('/dylibs.json', { cache: 'no-store' })
      .then(response => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); })
      .then(data => { dylibs = (data && data.dylibs) || []; })
      .catch(() => { dylibs = []; })
      .finally(() => render());

    fetch('/Packages', { cache: 'no-store' })
      .then(response => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.text(); })
      .then(text => { packages = parseIndex(text); loadState = 'ready'; render(); })
      .catch(error => { loadState = 'error'; loadError = error.message; render(); });

    fetch('/i18n.json', { cache: 'no-store' })
      .then(response => response.ok ? response.json() : {})
      .then(data => { pkgI18n = (data && data.packages) || {}; if (loadState === 'ready') render(); })
      .catch(() => {});

    document.querySelectorAll('[data-lang]').forEach(button => button.addEventListener('click', () => {
      lang = button.dataset.lang;
      try { localStorage.setItem('lang', lang); } catch (e) {}
      applyStatic();
      render();
    }));
    applyStatic();
    })();
  </script>
</body>
</html>
